<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="assets/css/dasda.css">
</head>
<body>

    <div class="container">
        <h1>Gerar Relatório</h1>
        <p class="subtitle">Selecione os filtros abaixo para exportar os dados desejados.</p>

        <form action="#" method="POST">
            
            <!-- Tipo de Relatório -->
            <div class="form-group">
                <label for="report-type">Tipo de Relatório</label>
                <select id="report-type" name="report_type" required>
                    <option value="" disabled selected>Selecione uma opção...</option>
                    <option value="vendas">Relatório de Vendas</option>
                    <option value="financeiro">Fluxo de Caixa / Financeiro</option>
                    <option value="clientes">Cadastro de Clientes</option>
                    <option value="Estoque">Controle de Estoque</option>
                </select>
            </div>

            <!-- Período / Datas -->
            <div class="date-range-group">
                <label>Período do Relatório</label>
                <div class="date-range">
                    <div>
                        <input type="date" id="date-start" name="date_start" required>
                    </div>
                    <div>
                        <input type="date" id="date-end" name="date_end" required>
                    </div>
                </div>
            </div>

            <!-- Status do Filtro -->
            <div class="status-group">
                <label for="status">Status</label>
                <select id="status" name="status">
                    <option value="todos">Todos</option>
                    <option value="ativos">Apenas Ativos / Concluídos</option>
                    <option value="pendentes">Pendentes</option>
                    <option value="cancelados">Cancelados</option>
                </select>
            </div>

            <!-- Formato de Saída -->
            <div class="form-group">
                <label>Formato de Exportação</label>
                <div class="radio-group">
                    <label class="radio-label">
                        <input type="radio" name="format" value="pdf" checked> PDF
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="format" value="excel"> Excel (XLSX)
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="format" value="csv"> CSV
                    </label>
                </div>
            </div>

            <!-- Botão de Ação -->
            <button type="submit" class="btn-submit">Gerar e Baixar Relatório</button>

        </form>
    </div>

</body>
</html>
