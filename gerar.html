<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerar Relatório</title>
    <link rel="stylesheet" href="assets/css/gerar.css">
    <link rel="stylesheet" href="assets/css/dashboard.css">
    <script src="https://kit.fontawesome.com/ecba8b4366.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="cabecalho">
        <h1>GERAR RELATÓRIO</h1>
        <div class="menu">
            <button class="btn btn-secondary dropdown-toggle" id="btnMenu" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                <i class="fa-solid fa-bars" style="color: rgb(255, 255, 255);"></i>
            </button>
            <ul class="dropdown-menu menu_opcoes">
                <li class="link"><a href="index.html">Login</a></li>
                <li class="link"><a href="dashboard.html">Dashboard</a></li>
                <li class="link"><a href="acessar.html">Acessar</a></li>
                <li class="link"><a href="catalogo.html">Catálogo</a></li>
                <input id="btn-temas" type="button" value="ALTERAR TEMA" onclick="toggleView(this)">
            </ul>
        </div>
    </div>

    
    
    
    
    <div class="container">
            
        <div class="card">
        
            <form action="" method="get">
                    
                    <div class="form-group">
                        <label for="report-type">Tipo de Relatório</label>
                        <select id="report-type" name="report_type" required>
                            <option value="" disabled selected>Selecione uma opção...</option>
                            <option value="vendas">Relatório de Vendas</option>
                            <option value="clientes">Cadastro de Clientes</option>
                            <option value="veiculos">Controle de Veículos</option>
                        </select>
                    </div>
                    
                    <div class="date-range-group">
                        <div class="date-range">
                            <div>
                                Data Inicial:
                                <br><input type="date" id="date-start" name="date_start" required>
                            </div>
                            <div>
                                Data Final:
                                <input type="date" id="date-end" name="date_end" required>
                            </div>
                        </div>
                </div>
                    <div class="status-group">
                        <label for="status">Status</label>
                        <select id="status" name="status">
                            <option value="todos">Todos</option>
                            <option value="ativos">Apenas Ativos / Concluídos</option>
                            <option value="pendentes">Pendentes</option>
                            <option value="cancelados">Cancelados</option>
                        </select>                                                                                                                                                
                    </div>
                    
                    <button type="submit" class="btn-submit">Gerar Relatório</button>

                </form>
        </div>    
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="assets/js/main.js"></script>




</body>
</html>
