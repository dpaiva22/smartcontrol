<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerar Relatório</title>
    <link rel="stylesheet" href="assets/css/gerar.css">
</head>
<body>
    <div class="cabecalho">
        <h1>GERAR RELATÓRIO</h1>
    </div>
    
    
    
    
    <div class="container">
        <div class="card">
            <form action="relatorio.html" method="get">
                <div class="input-group">
                    <label for="data_inicial">DATA INICIAL</label>
                    <input type="date" name= "data_inicial" id= "data_inicial" required><br><br>
                
                    <label for="data_final">DATA FINAL</label>
                    <input type="date" name= "data_final" id= "data_final" required><br><br>
                </div>
                <button type="submit">GERAR RELATÓRIO</button>
            </form>
        </div>
    </div>

</body>
</html>
